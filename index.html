<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario y ventas</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1f2421;--mu:#6b726d;--bd:#e2e0d8;--ac:#1d6b4f;--acx:#fff;--wa:#b4531a;--rd:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161a18;--card:#202522;--tx:#ecefec;--mu:#9aa39d;--bd:#323935;--ac:#4fb68d;--acx:#0d1a14;--wa:#e8975a;--rd:#f0857d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161a18;--card:#202522;--tx:#ecefec;--mu:#9aa39d;--bd:#323935;--ac:#4fb68d;--acx:#0d1a14;--wa:#e8975a;--rd:#f0857d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:6px 0 4px}h2{font-size:16px;margin:0 0 10px}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px 0 8px}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:999px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.stat b{display:block;font-size:20px}.stat span{color:var(--mu);font-size:13px}.stat i{display:block;color:var(--mu);font-size:13px;font-style:normal}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
button.b{background:var(--ac);color:var(--acx);border:0;padding:10px 14px;border-radius:8px;font:inherit;cursor:pointer}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd);padding:7px 10px;border-radius:8px;font:inherit;cursor:pointer}
button.d{color:var(--rd)}
.t{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);vertical-align:middle}th{color:var(--mu);font-weight:500;white-space:nowrap}
.cap{text-transform:capitalize}.low{color:var(--wa);font-weight:600}.out{color:var(--rd);font-weight:600}.mu{color:var(--mu);font-size:13px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;border:1px solid var(--bd)}
.tag.f{color:var(--wa);border-color:var(--wa)}
.tag.r{color:var(--rd);border-color:var(--rd);font-weight:600}.tag.g{color:var(--ac);border-color:var(--ac);font-weight:600}.tag.y{color:var(--wa);border-color:var(--wa)}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:15px}.chk input{width:auto}
.inl{display:flex;gap:6px;align-items:center}.inl input{width:90px}
.big{font-size:20px;font-weight:700;margin:10px 0}
.rt{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--mu)}
</style>
</head>
<body>
<main>
<h1>Inventario y ventas</h1>
<div class="rt" id="rt"></div>
<nav id="nav"></nav>
<div id="v"></div>
<p class="mu" id="st"></p>
</main>
<script>
const $=s=>document.querySelector(s);
const num=v=>parseFloat(String(v==null?"":v).replace(",","."))||0;
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bs=n=>(n||0).toLocaleString("es-VE",{maximumFractionDigits:2})+" Bs";
const usd=n=>"$"+(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const fd=i=>new Date(i).toLocaleString("es-VE",{dateStyle:"short",timeStyle:"short"});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const TABS=[["resumen","Resumen"],["vender","Vender"],["inv","Inventario"],["compras","Compras"],["fiados","Fiados"],["hist","Historial"],["tasas","Tasas"]];
const PL={u:"Unidad",c:"Caja",b:"Brazo"};
const SEED=[["consul","grande",20,1.43,1.4,120],["belmont","grande",20,2.64,1.4,200],["universal","grande",20,1.71,1.4,140],["lucky red","grande",20,2.81,1.4,220],["lucky nova","grande",20,3.04,1.4,250],["lucky cosmic","grande",20,3.04,1.4,250],["viceroy","grande",20,1.63,1.4,130],["belmont pequeño","pequeño",10,1.536,1.4,200],["pall mall","grande",20,0.83,1.5,80]];
let tab="resumen",db=null,cart=[];
const S={prod:[],venta:[],mov:[],cli:[],cfg:[],compra:[]};
const G={s:{pid:"",pres:"u",qty:"1",cust:"",credit:false,newc:""},c:{pid:"",pres:"c",qty:"1",mon:"USD",costo:"",tasa:"",prov:"Bigott"},a:{pid:"",pres:"u",qty:"",mot:"Conteo inicial"},e:{},r:null,p:{}};

function rates(){return S.cfg.find(x=>x.id==="rates")||{oficial:896.12,binance:1011.61,fecha:"2026-11-06",hist:[],def:true}}
const tvOf=r=>(num(r.oficial)+num(r.binance))/2;
const mult=(p,k)=>k==="u"?1:k==="c"?p.upc:p.upc*p.cpb;
const sug=(p,tv)=>Math.ceil(p.cu*p.mg*tv/p.upc-1e-9);
const punit=(p,tv)=>num(p.pm)>0?num(p.pm):sug(p,tv);
const MARGEN_STOCK=0.5; // por acabarse: hasta 50% por encima del mínimo
const stkTag=(p,v)=>{if(p.on===false)return"";const m=num(p.min)*p.upc;return v.u<=0?`<br><span class="tag r">🔴 Agotado</span>`:v.u<m?`<br><span class="tag r">🔴 Reponer</span>`:v.u<=m*(1+MARGEN_STOCK)?`<br><span class="tag y">🟡 Por acabarse</span>`:`<br><span class="tag g">🟢 OK</span>`};
const MARGEN=0.10; // un precio manual más de 10% sobre el sugerido se marca en verde (puede bajar)
const semaf=(p,tv)=>{if(!(num(p.pm)>0))return null;const s=sug(p,tv),m=num(p.pm);return m<s?{c:"r",t:"🔴 Subir",s}:m>s*(1+MARGEN)?{c:"g",t:"🟢 Puede bajar",s}:{c:"y",t:"🟡 OK",s}};
const semTag=(p,tv)=>{const z=semaf(p,tv);return z&&p.on!==false?` <span class="tag ${z.c}">${z.t}</span>`:""};
const price=(p,k,tv)=>punit(p,tv)*mult(p,k);
const bal=s=>s.cr&&!s.anu?s.total-(s.pay||[]).reduce((a,x)=>a+x.m,0):0;
function inv(){const m={};S.prod.forEach(p=>m[p.id]={u:0,ct:0});
  S.mov.slice().sort((a,b)=>a.f<b.f?-1:a.f>b.f?1:0).forEach(x=>{const o=m[x.pid];if(!o)return;
    if(x.q>0&&x.t==="c"){o.u+=x.q;o.ct+=x.cb}else{const av=o.u>0?o.ct/o.u:0;o.u+=x.q;o.ct+=x.q*av}});
  for(const k in m)m[k].avg=m[k].u>0?m[k].ct/m[k].u:0;return m}

function lsSave(){try{localStorage.setItem("crm-cig2",JSON.stringify(S))}catch(e){}}
async function put(c,o){const id=o.id||uid();const d=Object.assign({},o);delete d.id;
  if(db)await db.collection(c).doc(id).set(d);
  else{const i=S[c].findIndex(x=>x.id===id),n=Object.assign({id},d);if(i<0)S[c].push(n);else S[c][i]=n;lsSave();render()}
  return id}
async function del(c,id){if(db)await db.collection(c).doc(id).delete();else{S[c]=S[c].filter(x=>x.id!==id);lsSave();render()}}
async function init(){
  try{if(typeof claude!=="undefined")db=await claude.use("db")}catch(e){db=null}
  if(db){Object.keys(S).forEach(c=>db.collection(c).onSnapshot(sn=>{S[c]=sn.docs.map(d=>Object.assign({id:d.id},d.data()));render()},()=>{}))}
  else{try{const j=JSON.parse(localStorage.getItem("crm-cig2")||"null");if(j)Object.assign(S,j)}catch(e){}$("#st").textContent="Los datos se guardan solo en este navegador."}
  render()}

function render(){
  const r=rates(),tv=tvOf(r);
  $("#rt").innerHTML=`Oficial <b>${num(r.oficial).toFixed(2)}</b> · Binance <b>${num(r.binance).toFixed(2)}</b> · Tasa de venta <b>${tv.toFixed(2)}</b> Bs/$ ${r.def?"(sin guardar, ve a Tasas)":"(" +esc(r.fecha)+")"}`;
  $("#nav").innerHTML=TABS.map(t=>`<button class="${t[0]===tab?"on":""}" data-act="tab" data-id="${t[0]}">${t[1]}</button>`).join("");
  $("#v").innerHTML=({resumen:vRes,vender:vVen,inv:vInv,compras:vCom,fiados:vFia,hist:vHis,tasas:vTas})[tab]()}

const I=(g,k,x)=>`<input data-g="${g}" data-f="${k}" value="${esc(G[g][k]==null?"":G[g][k])}" ${x||""}>`;
const SE=(g,k,o)=>`<select data-g="${g}" data-f="${k}">${o.map(x=>`<option value="${esc(x[0])}" ${String(G[g][k])===String(x[0])?"selected":""}>${esc(x[1])}</option>`).join("")}</select>`;
const L=(t,h)=>`<div><label>${t}</label>${h}</div>`;
const PO=()=>[["","Elegir…"]].concat(S.prod.filter(p=>p.on!==false).map(p=>[p.id,p.n]));
const PRES=[["u","Unidad"],["c","Caja"],["b","Brazo"]];

function vRes(){
  const r=rates(),tv=tvOf(r),IV=inv(),now=new Date(),V=S.venta.filter(s=>!s.anu);
  const hoy=V.filter(s=>new Date(s.f).toDateString()===now.toDateString()),mes=V.filter(s=>{const d=new Date(s.f);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()});
  const sm=(a,f)=>a.reduce((x,s)=>x+f(s),0),tot=sm(hoy,s=>s.total),gan=tot-sm(hoy,s=>s.cb);
  const ganM=sm(mes,s=>s.total-s.cb),efM=sm(mes,s=>s.cb/s.to*(s.tv-s.to));
  const val=S.prod.reduce((a,p)=>a+(IV[p.id]?IV[p.id].ct:0),0),pc=V.reduce((a,s)=>a+bal(s),0);
  const top={};mes.forEach(s=>s.items.forEach(i=>top[i.n]=(top[i.n]||0)+i.units));
  const t3=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const low=S.prod.filter(p=>p.on!==false&&IV[p.id].u<num(p.min)*p.upc);
  const sem=S.prod.filter(p=>p.on!==false).map(p=>({p,z:semaf(p,tv)})).filter(x=>x.z&&x.z.c!=="y");
  return `<div class="grid">
  <div class="stat"><span>Vendido hoy</span><b>${bs(tot)}</b><i>${usd(sm(hoy,s=>s.total/s.tv))}</i></div>
  <div class="stat"><span>Ganancia hoy</span><b>${bs(gan)}</b><i>${usd(gan/tv)} · ${hoy.length} ventas${hoy.length?" · ticket "+bs(tot/hoy.length):""}</i></div>
  <div class="stat"><span>Inventario a costo</span><b>${bs(val)}</b><i>${usd(val/num(r.oficial||1))}</i></div>
  <div class="stat"><span>Por cobrar (fiados)</span><b>${bs(pc)}</b><i>${usd(pc/tv)}</i></div></div>
  <div class="card"><h2>Ganancia del mes</h2><p>Total: <b>${bs(ganM)}</b></p><p class="mu">Margen comercial: ${bs(ganM-efM)} · Efecto cambiario (brecha entre oficial y tasa de venta): ${bs(efM)}. Si el paralelo se acerca al oficial, esa segunda parte desaparece.</p></div>
  ${sem.length?`<div class="card"><h2>Revisar precios</h2><div class="t"><table><tr><th>Producto</th><th>Tu precio u</th><th>Sugerido u</th><th></th></tr>${sem.map(x=>`<tr><td class="cap">${esc(x.p.n)}</td><td>${bs(num(x.p.pm))}</td><td>${bs(x.z.s)}</td><td>${semTag(x.p,tv)}</td></tr>`).join("")}</table></div></div>`:""}
  <div class="card"><h2>Hay que reponer</h2>${low.length?`<div class="t"><table><tr><th>Producto</th><th>Stock</th><th>Mínimo</th></tr>${low.map(p=>`<tr><td class="cap">${esc(p.n)}</td><td class="${IV[p.id].u<=0?"out":"low"}">${IV[p.id].u} u (${(IV[p.id].u/p.upc).toFixed(1)} cajas)</td><td>${num(p.min)} cajas</td></tr>`).join("")}</table></div>`:`<p class="mu">Nada por debajo del mínimo.</p>`}</div>
  <div class="card"><h2>Más vendidos del mes</h2>${t3.length?t3.map(x=>`<div class="cap">${esc(x[0])}: ${x[1]} unidades</div>`).join(""):`<p class="mu">Sin ventas este mes.</p>`}</div>`}

function vVen(){
  const r=rates(),tv=tvOf(r),IV=inv(),g=G.s,total=cart.reduce((a,i)=>a+i.q*i.pr,0);
  const p=S.prod.find(x=>x.id===g.pid);
  return `<div class="card"><h2>Nueva venta</h2>
  <div class="row">${L("Producto",SE("s","pid",PO()))}${L("Presentación",SE("s","pres",PRES))}${L("Cantidad",I("s","qty",'type="number" min="1" inputmode="numeric"'))}<div><button class="b" data-act="add">Agregar</button></div></div>
  ${p?`<p class="mu">Stock: ${IV[p.id].u} u · Precio: ${bs(price(p,g.pres,tv))} por ${PL[g.pres].toLowerCase()}</p>`:""}
  ${cart.length?`<div class="t"><table><tr><th>Producto</th><th>Pres.</th><th>Cant.</th><th>Subtotal</th><th></th></tr>${cart.map((i,k)=>`<tr><td class="cap">${esc(i.n)}</td><td>${PL[i.pres]}</td><td>${i.q}</td><td>${bs(i.q*i.pr)}</td><td><button class="s d" data-act="rm" data-id="${k}">Quitar</button></td></tr>`).join("")}</table></div>`:`<p class="mu">Aún no hay productos en la venta.</p>`}
  <div class="big">Total: ${bs(total)} <span class="mu">(${usd(total/tv)})</span></div>
  <div class="row">${L("Cliente",SE("s","cust",[["","Contado (sin cliente)"]].concat(S.cli.map(c=>[c.id,c.n])).concat([["new","+ Cliente nuevo"]])))}${g.cust==="new"?L("Nombre del cliente nuevo",I("s","newc")):""}</div>
  <label class="chk"><input type="checkbox" ${g.credit?"checked":""} data-g="s" data-f="credit"> Es fiado (queda pendiente de pago)</label>
  <p><button class="b" data-act="reg">Registrar venta</button></p></div>`}

function vInv(){
  const r=rates(),tv=tvOf(r),IV=inv(),e=G.e,a=G.a;
  const seed=!S.prod.length?`<div class="card"><h2>Empieza aquí</h2><p>Carga los 9 productos de tu Excel con sus costos, % de ganancia y precios manuales.</p><button class="b" data-act="seed">Cargar productos del Excel</button></div>`:"";
  return seed+`<div class="card"><h2>${e.id?"Editar producto":"Nuevo producto"}</h2>
  <div class="row">${L("Nombre",I("e","n"))}${L("Tamaño",SE("e","sz",[["grande","Grande"],["pequeño","Pequeño"]]))}${L("Unidades por caja",I("e","upc",'type="number" inputmode="numeric"'))}${L("Cajas por brazo",I("e","cpb",'type="number" inputmode="numeric" placeholder="10"'))}${L("Costo por caja (USD)",I("e","cu",'type="number" inputmode="decimal"'))}${L("% ganancia (1.4 = 40%)",I("e","mg",'type="number" inputmode="decimal"'))}${L("Precio manual por unidad (Bs, opcional)",I("e","pm",'type="number" inputmode="decimal"'))}${L("Avisar bajo (cajas)",I("e","min",'type="number" inputmode="numeric"'))}</div>
  <p><button class="b" data-act="save">Guardar</button> ${e.id?`<button class="s" data-act="cancel">Cancelar</button>`:""}</p></div>
  <div class="card"><h2>Ajuste de inventario (conteo inicial, merma, etc.)</h2>
  <div class="row">${L("Producto",SE("a","pid",PO()))}${L("Presentación",SE("a","pres",PRES))}${L("Cantidad (+ o -)",I("a","qty",'type="number" inputmode="numeric"'))}${L("Motivo",SE("a","mot",["Conteo inicial","Merma","Robo","Error de conteo","Consumo propio"].map(x=>[x,x])))}<div><button class="b" data-act="adj">Aplicar</button></div></div></div>
  <div class="card"><h2>Productos</h2>${S.prod.length?`<div class="t"><table><tr><th>Producto</th><th>Stock</th><th>Costo prom. / u</th><th>Precio u</th><th>Caja</th><th>Brazo</th><th>Valor</th><th></th></tr>
  ${S.prod.slice().sort((x,y)=>x.n.localeCompare(y.n)).map(p=>{const v=IV[p.id],low=v.u<num(p.min)*p.upc;return `<tr><td class="cap">${esc(p.n)}${p.on===false?' <span class="tag">inactivo</span>':""}</td><td class="${v.u<=0?"out":low?"low":""}">${v.u} u<br><span class="mu">${(v.u/p.upc).toFixed(1)} cajas</span>${stkTag(p,v)}</td><td>${bs(v.avg)}</td>
  <td>${bs(punit(p,tv))}<br><span class="mu">${num(p.pm)>0?"manual · sugerido "+sug(p,tv):"calculado"}</span>${semTag(p,tv)}</td><td>${bs(price(p,"c",tv))}</td><td>${bs(price(p,"b",tv))}</td><td>${bs(v.ct)}</td>
  <td><button class="s" data-act="edit" data-id="${p.id}">Editar</button> <button class="s" data-act="tog" data-id="${p.id}">${p.on===false?"Activar":"Desactivar"}</button></td></tr>`}).join("")}</table></div>`:`<p class="mu">Aún no hay productos.</p>`}</div>`}

function vCom(){
  const c=G.c,p=S.prod.find(x=>x.id===c.pid),r=rates();
  const cajas=p?num(c.qty)*(c.pres==="b"?p.cpb:1):0,t=c.mon==="USD"?(num(c.tasa)||num(r.oficial)):1;
  const C=S.compra||[];
  return `<div class="card"><h2>Registrar compra</h2>
  <div class="row">${L("Producto",SE("c","pid",PO()))}${L("Comprado por",SE("c","pres",[["c","Caja"],["b","Brazo"]]))}${L("Cantidad",I("c","qty",'type="number" inputmode="numeric"'))}${L("Moneda",SE("c","mon",[["USD","Dólares"],["BS","Bolívares"]]))}${L("Costo por caja ("+(c.mon==="USD"?"USD":"Bs")+")",I("c","costo",'type="number" inputmode="decimal" placeholder="'+(p&&c.mon==="USD"?p.cu:"")+'"'))}${c.mon==="USD"?L("Tasa aplicada (vacío = oficial)",I("c","tasa",'type="number" inputmode="decimal" placeholder="'+num(r.oficial)+'"')):""}${L("Proveedor",I("c","prov"))}</div>
  ${p&&num(c.costo)>0?`<p class="big">${cajas} cajas = ${cajas*p.upc} unidades · Total ${bs(cajas*num(c.costo)*t)}</p>`:""}
  <p><button class="b" data-act="buy">Guardar compra</button></p></div>
  <div class="card"><h2>Compras recientes</h2>${S.compra&&S.compra.length?`<div class="t"><table><tr><th>Fecha</th><th>Producto</th><th>Cajas</th><th>Costo/caja</th><th>Total Bs</th></tr>${S.compra.slice().sort((a,b)=>a.f<b.f?1:-1).slice(0,30).map(x=>`<tr><td>${fd(x.f)}</td><td class="cap">${esc(x.n)}</td><td>${x.cajas}</td><td>${x.mon==="USD"?usd(x.costo)+" a "+num(x.tasa).toFixed(2):bs(x.costo)}</td><td>${bs(x.tb)}</td></tr>`).join("")}</table></div>`:`<p class="mu">Sin compras registradas.</p>`}</div>`}

function vFia(){
  const tv=tvOf(rates());
  const L2=S.cli.map(c=>{const o=S.venta.filter(s=>s.cid===c.id&&bal(s)>0);return{c,o,d:o.reduce((a,s)=>a+bal(s),0)}});
  const con=L2.filter(x=>x.d>0).sort((a,b)=>b.d-a.d),sin=L2.filter(x=>x.d<=0);
  return `<div class="card"><h2>Cuentas por cobrar</h2>${con.length?con.map(x=>`<div style="border-top:1px solid var(--bd);padding:10px 0"><b class="cap">${esc(x.c.n)}</b> <span class="tag f">Debe ${bs(x.d)} (${usd(x.d/tv)})</span>
  <div class="mu">${x.o.sort((a,b)=>a.f<b.f?-1:1).map(s=>fd(s.f)+": "+bs(bal(s))).join(" · ")}</div>
  <div class="inl" style="margin-top:6px"><input type="number" inputmode="decimal" placeholder="Abono Bs" style="width:130px" value="${esc(G.p["a"+x.c.id]||"")}" data-g="p" data-f="a${x.c.id}"><button class="b" data-act="abono" data-id="${x.c.id}">Registrar abono</button></div></div>`).join(""):`<p class="mu">Nadie te debe nada por ahora.</p>`}</div>
  ${sin.length?`<div class="card"><h2>Clientes al corriente</h2><p class="mu cap">${sin.map(x=>esc(x.c.n)).join(", ")}</p></div>`:""}`}

function vHis(){
  const l=S.venta.slice().sort((a,b)=>a.f<b.f?1:-1).slice(0,150);
  return `<div class="card"><h2>Historial de ventas</h2>${l.length?`<div class="t"><table><tr><th>Fecha</th><th>Cliente</th><th>Detalle</th><th>Total</th><th>Ganancia</th><th>Estado</th><th></th></tr>${l.map(s=>`<tr style="${s.anu?"opacity:.5":""}"><td>${fd(s.f)}</td><td class="cap">${esc(s.cn||"Contado")}</td><td class="cap">${s.items.map(i=>esc(i.n)+" "+i.q+" "+PL[i.pres].toLowerCase()).join(", ")}</td><td>${bs(s.total)}<br><span class="mu">tasa ${s.tv.toFixed(2)}</span></td><td>${bs(s.total-s.cb)}</td>
  <td>${s.anu?'<span class="tag">Anulada</span>':s.cr?(bal(s)>0?`<span class="tag f">Debe ${bs(bal(s))}</span>`:'<span class="tag">Pagado</span>'):'<span class="tag">Contado</span>'}</td><td>${s.anu?"":`<button class="s d" data-act="void" data-id="${s.id}">Anular</button>`}</td></tr>`).join("")}</table></div>`:`<p class="mu">Todavía no hay ventas.</p>`}</div>`}

function vTas(){
  const r=rates();if(!G.r)G.r={oficial:r.oficial,binance:r.binance};
  const o=num(G.r.oficial),b=num(G.r.binance);
  return `<div class="card"><h2>Tasas de cambio</h2><div class="row">${L("Oficial BCV (Bs/$)",I("r","oficial",'type="number" inputmode="decimal"'))}${L("Binance / paralelo (Bs/$)",I("r","binance",'type="number" inputmode="decimal"'))}<div><button class="b" data-act="rate">Guardar tasa de hoy</button></div></div>
  <p class="big">Tasa de venta: ${((o+b)/2).toFixed(2)} Bs/$</p><p class="mu">Se calcula como (oficial + Binance) / 2. Brecha actual: ${o?((b/o-1)*100).toFixed(1):0} %. La oficial se usa para costear compras en dólares; la de venta, para calcular precios. Cada venta guarda las tres tasas del momento y nunca cambia después.</p></div>
  <div class="card"><h2>Historial</h2>${(r.hist||[]).length?`<div class="t"><table><tr><th>Fecha</th><th>Oficial</th><th>Binance</th><th>Venta</th></tr>${r.hist.map(h=>`<tr><td>${esc(h.f)}</td><td>${num(h.oficial).toFixed(2)}</td><td>${num(h.binance).toFixed(2)}</td><td>${tvOf(h).toFixed(2)}</td></tr>`).join("")}</table></div>`:`<p class="mu">Aún no hay tasas guardadas.</p>`}</div>`}

document.addEventListener("input",e=>{const t=e.target,g=t.dataset&&t.dataset.g;if(!g)return;G[g][t.dataset.f]=t.type==="checkbox"?t.checked:t.value});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset&&t.dataset.g&&t.tagName==="SELECT")render()});
document.addEventListener("click",async e=>{
  const bt=e.target.closest("[data-act]");if(!bt)return;const a=bt.dataset.act,id=bt.dataset.id;
  const r=rates(),tv=tvOf(r),iso=new Date().toISOString(),IV=inv();
  try{
  if(a==="tab"){tab=id;render()}
  else if(a==="add"){const g=G.s,p=S.prod.find(x=>x.id===g.pid),q=Math.floor(num(g.qty));if(!p||q<1)return;
    const u=q*mult(p,g.pres),have=cart.filter(i=>i.pid===p.id).reduce((s,i)=>s+i.units,0);
    if(have+u>IV[p.id].u){alert("Solo hay "+IV[p.id].u+" unidades de "+p.n);return}
    cart.push({pid:p.id,n:p.n,pres:g.pres,q,units:u,pr:price(p,g.pres,tv),cb:u*IV[p.id].avg});g.pid="";g.qty="1";render()}
  else if(a==="rm"){cart.splice(+id,1);render()}
  else if(a==="reg"){const g=G.s;if(!cart.length){alert("Agrega al menos un producto.");return}
    let cid=g.cust,cn="";
    if(cid==="new"){cn=(g.newc||"").trim();if(!cn){alert("Escribe el nombre del cliente.");return}cid=await put("cli",{n:cn})}
    else if(cid){cn=(S.cli.find(c=>c.id===cid)||{}).n||""}
    if(g.credit&&!cid){alert("Para fiar, elige o crea un cliente.");return}
    const total=cart.reduce((s,i)=>s+i.q*i.pr,0),vid=await put("venta",{f:iso,cid:cid||"",cn,items:cart,total,cb:cart.reduce((s,i)=>s+i.cb,0),cr:!!g.credit,pay:[],to:num(r.oficial),tb:num(r.binance),tv,anu:false});
    for(const l of cart)await put("mov",{pid:l.pid,t:"v",q:-l.units,f:iso,ref:vid});
    cart=[];G.s={pid:"",pres:"u",qty:"1",cust:"",credit:false,newc:""};render()}
  else if(a==="seed"){for(const x of SEED)await put("prod",{n:x[0],sz:x[1],upc:x[2],cpb:x[1]==="pequeño"?12:10,cu:x[3],mg:x[4],pm:x[5],min:2,on:true})}
  else if(a==="save"){const e2=G.e;if(!(e2.n||"").trim()||num(e2.upc)<1){alert("Falta el nombre o las unidades por caja.");return}
    await put("prod",{id:e2.id,n:e2.n.trim(),sz:e2.sz||"grande",upc:num(e2.upc),cpb:num(e2.cpb)||10,cu:num(e2.cu),mg:num(e2.mg)||1.4,pm:num(e2.pm),min:num(e2.min),on:e2.on!==false});G.e={};render()}
  else if(a==="edit"){G.e=Object.assign({},S.prod.find(x=>x.id===id));render()}
  else if(a==="cancel"){G.e={};render()}
  else if(a==="tog"){const p=S.prod.find(x=>x.id===id);await put("prod",Object.assign({},p,{on:p.on===false}))}
  else if(a==="adj"){const g=G.a,p=S.prod.find(x=>x.id===g.pid),q=Math.round(num(g.qty)*(p?mult(p,g.pres):0));if(!p||!q){alert("Elige producto y cantidad.");return}
    await put("mov",{pid:p.id,t:"a",q,f:iso,m:g.mot});g.qty="";render()}
  else if(a==="buy"){const c=G.c,p=S.prod.find(x=>x.id===c.pid),n=num(c.qty);if(!p||n<=0||num(c.costo)<=0){alert("Completa producto, cantidad y costo.");return}
    const cajas=n*(c.pres==="b"?p.cpb:1),isU=c.mon==="USD",t=isU?(num(c.tasa)||num(r.oficial)):1,tb=cajas*num(c.costo)*t;
    const cid=await put("compra",{f:iso,prov:c.prov,pid:p.id,n:p.n,cajas,mon:c.mon,costo:num(c.costo),tasa:t,tb});
    await put("mov",{pid:p.id,t:"c",q:cajas*p.upc,cb:tb,f:iso,ref:cid});
    await put("prod",Object.assign({},p,{cu:isU?num(c.costo):num(c.costo)/num(r.oficial)}));
    G.c.qty="1";G.c.costo="";render()}
  else if(a==="abono"){let m=num(G.p["a"+id]);if(m<=0)return;G.p["a"+id]="";
    for(const s of S.venta.filter(s=>s.cid===id&&bal(s)>0).sort((x,y)=>x.f<y.f?-1:1)){if(m<=0)break;const ap=Math.min(m,bal(s));m-=ap;await put("venta",Object.assign({},s,{pay:(s.pay||[]).concat([{f:iso,m:ap}])}))}
    if(m>0)alert("Sobraron "+bs(m)+": el abono era mayor a la deuda.");render()}
  else if(a==="void"){if(!confirm("¿Anular esta venta? Los productos vuelven al inventario."))return;
    const s=S.venta.find(x=>x.id===id);await put("venta",Object.assign({},s,{anu:true}));
    for(const m of S.mov.filter(m=>m.ref===id))await del("mov",m.id)}
  else if(a==="rate"){const o=num(G.r.oficial),b=num(G.r.binance);if(o<=0||b<=0){alert("Escribe ambas tasas.");return}
    const prev=num(r.oficial);if(prev&&Math.abs(o/prev-1)>.25&&!confirm("La oficial cambió más de 25 %. ¿Confirmas?"))return;
    const f=iso.slice(0,10);await put("cfg",{id:"rates",oficial:o,binance:b,fecha:f,hist:[{f,oficial:o,binance:b}].concat(r.hist||[]).slice(0,60)});render()}
  }catch(err){alert("No se pudo guardar: "+(err&&err.message||err))}
});
init();
</script>
