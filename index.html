<!DOCTYPE html>
<html lang="es">
<head>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CRM Ventas">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)">
<title>Inventario y ventas</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2230;--mu:#5d6678;--bd:#dde3ee;--ac:#1d4ed8;--gr:#1a7f4b;--bar:#f5b50a;--acx:#fff;--wa:#b4531a;--rd:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#182033;--tx:#e8edf7;--mu:#9aa6bd;--bd:#2a3550;--ac:#6ea8fe;--gr:#5fd08f;--bar:#ffcf3f;--acx:#0b1220;--wa:#e8975a;--rd:#f0857d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#182033;--tx:#e8edf7;--mu:#9aa6bd;--bd:#2a3550;--ac:#6ea8fe;--gr:#5fd08f;--bar:#ffcf3f;--acx:#0b1220;--wa:#e8975a;--rd:#f0857d;color-scheme:dark}
html{background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:6px 0 4px}h2{font-size:16px;margin:0 0 10px}
nav{display:flex;gap:6px;overflow-x:auto;position:sticky;top:0;z-index:40;background:var(--bg);margin:0 -12px 6px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;border-bottom:1px solid var(--bd)}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:999px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.stat b{display:block;font-size:20px}.stat span{color:var(--mu);font-size:13px}.stat i{display:block;color:var(--mu);font-size:13px;font-style:normal}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.mo{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}.mo>div{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:16px;width:100%;max-width:420px;max-height:90vh;overflow:auto}.mo h2{margin-top:0}
.al{padding:10px 12px;border-radius:12px;border:1px solid;margin:0 0 12px;font-size:14px;background:var(--card)}.al.r{color:var(--rd);border-color:var(--rd)}.al.y{color:var(--wa);border-color:var(--wa)}
.stat.r{border-color:var(--rd)}.stat.r b{color:var(--rd)}.stat.y{border-color:var(--wa)}.stat.y b{color:var(--wa)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
button.b{background:var(--ac);color:var(--acx);border:0;padding:10px 14px;border-radius:8px;font:inherit;cursor:pointer}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd);padding:7px 10px;border-radius:8px;font:inherit;cursor:pointer}
button.d{color:var(--rd)}
.t{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);vertical-align:middle}th{color:var(--mu);font-weight:500;white-space:nowrap}
.cap{text-transform:capitalize}.low{color:var(--wa);font-weight:600}.out{color:var(--rd);font-weight:600}.mu{color:var(--mu);font-size:13px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;border:1px solid var(--bd)}
.tag.f{color:var(--wa);border-color:var(--wa)}
.tag.r{color:var(--rd);border-color:var(--rd);font-weight:600}.tag.g{color:var(--gr);border-color:var(--gr);font-weight:600}.tag.y{color:var(--wa);border-color:var(--wa)}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:15px}.chk input{width:auto}
.inl{display:flex;gap:6px;align-items:center}.inl input{width:90px}
.big{font-size:20px;font-weight:700;margin:10px 0}
.rt{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--mu)}
.toast{position:fixed;z-index:50;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);width:min(92vw,520px);display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-left:5px solid var(--ac);box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:14px}
.toast[hidden]{display:none}.toast.er{border-left-color:var(--rd)}.toast div{flex:1}
.toast button{background:none;border:0;color:var(--mu);font-size:20px;line-height:1;cursor:pointer;padding:0 2px}
.bar{display:grid;grid-template-columns:96px 1fr 104px;gap:8px;align-items:center;margin:6px 0}
.bl{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{background:var(--bd);border-radius:6px;height:20px;overflow:hidden}
.bt i{display:block;height:100%;background:var(--bar);border-radius:6px}
.bv{font-size:12px;text-align:right;line-height:1.25}
.ax .bt{background:none;height:auto;display:flex;justify-content:space-between;font-size:11px;color:var(--mu)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btns button{padding:10px 14px}.btns button:disabled{opacity:.6;cursor:wait}
</style>
</head>
<body>
<div id="toast" class="toast" role="alert" hidden></div>
<main>
<nav id="nav"></nav>
<h1>Inventario y ventas</h1>
<div class="rt" id="rt"></div>
<div id="v"></div>
<p class="mu" id="st"></p>
</main>
<script>
const $=s=>document.querySelector(s);
const num=v=>parseFloat(String(v==null?"":v).replace(",","."))||0;
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bs=n=>(n||0).toLocaleString("es-VE",{maximumFractionDigits:2})+" Bs";
const usd=n=>"$"+(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const fd=i=>new Date(i).toLocaleString("es-VE",{dateStyle:"short",timeStyle:"short"});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const TABS=[["resumen","Resumen"],["vender","Vender"],["inv","Inventario"],["compras","Compras"],["fiados","Fiados"],["tesoreria","Tesorería"],["hist","Historial"],["tasas","Tasas"],["admin","Admin"]];
const PL={u:"Unidad",c:"Caja",b:"Brazo"};
const SEED=[["consul","grande",20,1.43,1.4,120],["belmont","grande",20,2.64,1.4,200],["universal","grande",20,1.71,1.4,140],["lucky red","grande",20,2.81,1.4,220],["lucky nova","grande",20,3.04,1.4,250],["lucky cosmic","grande",20,3.04,1.4,250],["viceroy","grande",20,1.63,1.4,130],["belmont pequeño","pequeño",10,1.536,1.4,200],["pall mall","grande",20,0.83,1.5,80]];
let tab="resumen",db=null,cart=[];
const S={prod:[],venta:[],mov:[],cli:[],cfg:[],compra:[],gasto:[]};
const G={s:{pid:"",pres:"u",qty:"1",cust:"",credit:false,newc:""},c:{pid:"",pres:"c",qty:"1",mon:"USD",costo:"",tasa:"",prov:"Bigott"},a:{pid:"",pres:"u",qty:"",mot:"Conteo inicial"},e:{},r:null,p:{},t:{c:"",m:"",f:"",mon:"BS"},m:{open:false,step:"form",cid:"",tipo:"pm",monto:""}};

function rates(){return S.cfg.find(x=>x.id==="rates")||{oficial:896.12,binance:1011.61,fecha:"2026-11-06",hist:[],def:true}}
const tvOf=r=>(num(r.oficial)+num(r.binance))/2;
const mult=(p,k)=>k==="u"?1:k==="c"?p.upc:p.upc*p.cpb;
const sug=(p,tv)=>Math.ceil(p.cu*p.mg*tv/p.upc-1e-9);
const punit=(p,tv)=>num(p.pm)>0?num(p.pm):sug(p,tv);
const UMBRAL_ROJO=25,UMBRAL_AMARILLO=59; // unidades: rojo hasta 25, amarillo de 26 a 59, verde más de 59
const cajasTxt=(u,upc)=>{if(u<0)return u+" unidades";const c=Math.floor(u/upc),r=u%upc,a=c+(c===1?" caja":" cajas"),b=r+(r===1?" unidad":" unidades");return c===0?b:r===0?a:a+" y "+b};
const stkTag=(p,v)=>{if(p.on===false)return"";return v.u<=0?`<br><span class="tag r">🔴 Agotado</span>`:v.u<=UMBRAL_ROJO?`<br><span class="tag r">🔴 Reponer</span>`:v.u<=UMBRAL_AMARILLO?`<br><span class="tag y">🟡 Por acabarse</span>`:`<br><span class="tag g">🟢 OK</span>`};
async function fetchTasas(){const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),10000);try{const res=await fetch("https://ve.dolarapi.com/v1/dolares",{signal:ctl.signal,cache:"no-store"});if(!res.ok)throw new Error("HTTP "+res.status);const d=await res.json(),f=k=>d.find(x=>String(x.fuente||x.nombre||"").toLowerCase().includes(k)),of=f("oficial"),pa=f("paralelo"),o=num(of&&(of.promedio||of.venta)),b=num(pa&&(pa.promedio||pa.venta));if(!(o>0&&b>0))throw new Error("respuesta incompleta");return{o:Math.round(o*100)/100,b:Math.round(b*100)/100}}catch(e){throw new Error(e.name==="AbortError"?"tiempo agotado":e.message)}finally{clearTimeout(tm)}}
const MARGEN=0.10; // un precio manual más de 10% sobre el sugerido se marca en verde (puede bajar)
const semaf=(p,tv)=>{if(!(num(p.pm)>0))return null;const s=sugB(p),m=num(p.pm);return m<s?{c:"r",t:"🔴 Subir",s}:m>s*(1+MARGEN)?{c:"g",t:"🟢 Puede bajar",s}:{c:"y",t:"🟡 OK",s}};
const semTag=(p,tv)=>{const z=semaf(p,tv);return z&&p.on!==false?` <span class="tag ${z.c}">${z.t}</span>`:""};
const sugB=p=>Math.ceil(p.cu*p.mg*num(rates().binance)/p.upc-1e-9); // sugerido del inventario: tasa Binance
const price=(p,k,tv)=>punit(p,tv)*mult(p,k);
const bal=s=>s.cr&&!s.anu?s.total-(s.pay||[]).reduce((a,x)=>a+x.m,0):0;
function inv(){const m={};S.prod.forEach(p=>m[p.id]={u:0,ct:0});
  S.mov.slice().sort((a,b)=>a.f<b.f?-1:a.f>b.f?1:0).forEach(x=>{const o=m[x.pid];if(!o)return;
    if(x.q>0&&(x.t==="c"||x.m==="Conteo inicial")){const pp=S.prod.find(z=>z.id===x.pid);o.u+=x.q;o.ct+=x.t==="c"?x.cb:(x.cb!=null?x.cb:(pp?x.q/pp.upc*num(pp.cu)*num(rates().oficial):0))}else{const av=o.u>0?o.ct/o.u:0;o.u+=x.q;o.ct+=x.q*av}});
  for(const k in m)m[k].avg=m[k].u>0?m[k].ct/m[k].u:0;return m}

function lsSave(){try{localStorage.setItem("crm-cig2",JSON.stringify(S))}catch(e){}}
async function put(c,o){const id=o.id||uid();const d=Object.assign({},o);delete d.id;
  if(db)await db.collection(c).doc(id).set(d);
  else{const i=S[c].findIndex(x=>x.id===id),n=Object.assign({id},d,{u:Date.now()});if(i<0)S[c].push(n);else S[c][i]=n;lsSave();render()}
  return id}
async function del(c,id){if(db)await db.collection(c).doc(id).delete();else{S.tomb=(S.tomb||[]).concat([id]);S[c]=S[c].filter(x=>x.id!==id);lsSave();render()}}
const ARCH={"datos/ventas.json":["venta","cli","gasto"],"datos/inventario.json":["prod","mov","compra"],"datos/config.json":["cfg"]};
const SYNC_KEYS=["venta","cli","prod","mov","compra","cfg","gasto"];
function mrg(base,over){const m=new Map();(base||[]).forEach(x=>m.set(x.id,x));(over||[]).forEach(x=>{const o=m.get(x.id);if(!o||(x.u||0)>=(o.u||0))m.set(x.id,x)});return[...m.values()]}
function limpiarBorrados(){S.tomb=S.tomb||[];const t=new Set(S.tomb);SYNC_KEYS.forEach(k=>{S[k]=(S[k]||[]).filter(x=>!t.has(x.id))})}
function ub64(s){return new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")),c=>c.charCodeAt(0)))}
async function pullRemote(){for(const f in ARCH){try{const r=await fetch(f+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)continue;const j=await r.json();if(j.pub&&(!S.pub||j.pub>S.pub))S.pub=j.pub;S.tomb=[...new Set([...(S.tomb||[]),...(j.tomb||[])])];ARCH[f].forEach(k=>{if(Array.isArray(j[k]))S[k]=mrg(S[k],j[k])})}catch(e){}}limpiarBorrados()}
async function init(){
  try{if(typeof claude!=="undefined")db=await claude.use("db")}catch(e){db=null}
  if(db){Object.keys(S).forEach(c=>db.collection(c).onSnapshot(sn=>{S[c]=sn.docs.map(d=>Object.assign({id:d.id},d.data()));render()},()=>{}))}
  else{try{const j=JSON.parse(localStorage.getItem("crm-cig2")||"null");if(j)Object.assign(S,j)}catch(e){}$("#st").textContent="Los datos se guardan solo en este navegador."}
  if(!db){await pullRemote();lsSave()}
  render()}

function render(){
  const r=rates(),tv=tvOf(r);
  $("#rt").innerHTML=`Oficial <b>${num(r.oficial).toFixed(2)}</b> · Binance <b>${num(r.binance).toFixed(2)}</b> · Tasa de venta <b>${tv.toFixed(2)}</b> Bs/$ ${r.def?"(sin guardar, ve a Tasas)":"(" +esc(r.fecha)+")"} · Última publicación: <b>${S.pub?fd(S.pub):"ninguna aún"}</b>`;
  $("#nav").innerHTML=TABS.map(t=>`<button class="${t[0]===tab?"on":""}" data-act="tab" data-id="${t[0]}">${t[1]}</button>`).join("");
  $("#v").innerHTML=({resumen:vRes,vender:vVen,inv:vInv,compras:vCom,fiados:vFia,tesoreria:vTes,hist:vHis,tasas:vTas,admin:vGit})[tab]();drawModal()}

const I=(g,k,x)=>`<input data-g="${g}" data-f="${k}" value="${esc(G[g][k]==null?"":G[g][k])}" ${x||""}>`;
const SE=(g,k,o)=>`<select data-g="${g}" data-f="${k}">${o.map(x=>`<option value="${esc(x[0])}" ${String(G[g][k])===String(x[0])?"selected":""}>${esc(x[1])}</option>`).join("")}</select>`;
const L=(t,h)=>`<div><label>${t}</label>${h}</div>`;
const PO=()=>[["","Elegir…"]].concat(S.prod.filter(p=>p.on!==false).map(p=>[p.id,p.n]));
const PRES=[["u","Unidad"],["c","Caja"],["b","Brazo"]];

function vRes(){
  const r=rates(),tv=tvOf(r),IV=inv(),now=new Date(),V=S.venta.filter(s=>!s.anu);
  const hoy=V.filter(s=>new Date(s.f).toDateString()===now.toDateString()),mes=V.filter(s=>{const d=new Date(s.f);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()});
  const sm=(a,f)=>a.reduce((x,s)=>x+f(s),0),tot=sm(hoy,s=>s.total),gan=tot-sm(hoy,s=>s.cb);
  const ganM=sm(mes,s=>s.total-s.cb),efM=sm(mes,s=>s.cb/s.to*(s.tv-s.to));
  const val=S.prod.reduce((a,p)=>a+(IV[p.id]?IV[p.id].ct:0),0),pc=V.reduce((a,s)=>a+bal(s),0);
  const top={};mes.forEach(s=>s.items.forEach(i=>top[i.n]=(top[i.n]||0)+i.units));
  const t3=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const low=S.prod.filter(p=>p.on!==false&&IV[p.id].u<=UMBRAL_ROJO);
  const pot=S.prod.filter(p=>p.on!==false&&IV[p.id].u>0).map(p=>{const u=IV[p.id].u,c=IV[p.id].ct;return{p,u,c,v:u*punit(p,tv)}}),vp=sm(pot,x=>x.v),gp=vp-sm(pot,x=>x.c);
  const ofi=num(r.oficial)||1,bd=n=>bs(n)+'<br><span class="mu">'+usd(n/ofi)+'</span>';
  const sem=S.prod.filter(p=>p.on!==false).map(p=>({p,z:semaf(p,tv)})).filter(x=>x.z&&x.z.c!=="y");
  return `<div class="grid">
  <div class="stat"><span>Vendido hoy</span><b>${bs(tot)}</b><i>${usd(sm(hoy,s=>s.total/s.tv))}</i></div>
  <div class="stat"><span>Ganancia hoy</span><b>${bs(gan)}</b><i>${usd(gan/tv)} · ${hoy.length} ventas${hoy.length?" · ticket "+bs(tot/hoy.length):""}</i></div>
  <div class="stat"><span>Inventario a costo</span><b>${bs(val)}</b><i>${usd(val/num(r.oficial||1))}</i></div>
  <div class="stat"><span>Inventario a precio de venta</span><b>${bs(vp)}</b><i>${usd(vp/ofi)}</i></div>
  <div class="stat"><span>Ganancia del inventario</span><b>${bs(gp)}</b><i>${usd(gp/tv)} · venta total ${bs(vp)}</i></div>
  <div class="stat"><span>Por cobrar (fiados)</span><b>${bs(pc)}</b><i>${usd(pc/tv)}</i></div></div>
  <div class="card"><h2>Ganancia del mes</h2><p>Total: <b>${bs(ganM)}</b> <span class="mu">(${usd(ganM/ofi)} a tasa oficial)</span></p><p class="mu">Margen comercial: ${bs(ganM-efM)} · Efecto cambiario (brecha entre oficial y tasa de venta): ${bs(efM)}. Si el paralelo se acerca al oficial, esa segunda parte desaparece.</p></div>
  ${sem.length?`<div class="card"><h2>Revisar precios</h2><div class="t"><table><tr><th>Producto</th><th>Tu precio u</th><th>Sugerido u</th><th></th></tr>${sem.map(x=>`<tr><td class="cap">${esc(x.p.n)}</td><td>${bs(num(x.p.pm))}</td><td>${bs(x.z.s)}</td><td>${semTag(x.p,tv)}</td></tr>`).join("")}</table></div></div>`:""}
  ${pot.length?`<div class="card"><h2>Inventario: costo y ganancia por producto</h2><div class="t"><table><tr><th>Producto</th><th>Stock</th><th>Costo</th><th>Precio</th><th>Ganancia</th></tr>${pot.map(x=>`<tr><td class="cap">${esc(x.p.n)}</td><td>${cajasTxt(x.u,x.p.upc)}</td><td>${bd(x.c)}</td><td>${bd(x.v)}</td><td>${bd(x.v-x.c)}</td></tr>`).join("")}<tr><th>Total</th><th></th><th>${bd(sm(pot,x=>x.c))}</th><th>${bd(vp)}</th><th>${bd(gp)}</th></tr></table></div></div>`:""}
  <div class="card"><h2>Hay que reponer</h2>${low.length?`<div class="t"><table><tr><th>Producto</th><th>Stock</th><th>Sugerido de compra</th></tr>${low.map(p=>`<tr><td class="cap">${esc(p.n)}</td><td class="${IV[p.id].u<=0?"out":"low"}">${IV[p.id].u} u<br><span class="mu">${cajasTxt(IV[p.id].u,p.upc)}</span></td><td>${sugHtml(p)}</td></tr>`).join("")}</table></div>`:`<p class="mu">Nada con ${UMBRAL_ROJO} unidades o menos.</p>`}</div>
  ${chartVentas({hoy,mes,todo:V})}`}

function vVen(){
  const r=rates(),tv=tvOf(r),IV=inv(),g=G.s,total=cart.reduce((a,i)=>a+i.q*i.pr,0);
  const p=S.prod.find(x=>x.id===g.pid);
  return `<div class="card"><h2>Nueva venta</h2>
  <div class="row">${L("Producto",SE("s","pid",PO()))}${L("Presentación",SE("s","pres",PRES))}${L("Cantidad",I("s","qty",'type="number" min="1" inputmode="numeric"'))}${L("Precio especial por unidad (Bs)",I("s","sp",'type="number" min="0" inputmode="decimal" placeholder="Opcional"'))}<div><button class="b" data-act="add">Agregar</button></div></div>
  ${p?`<p class="mu">Stock: ${IV[p.id].u} u · Precio: ${bs(price(p,g.pres,tv))} por ${PL[g.pres].toLowerCase()}</p>`:""}
  <p class="mu" id="dcp">${dcTxt()}</p>

const b64=s=>{const b=new TextEncoder().encode(s);let r="";for(let i=0;i<b.length;i+=8192)r+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(r)};
async function ghApi(path,opt,tok){let res;
  try{res=await fetch("https://api.github.com"+path,Object.assign({cache:"no-store"},opt,{headers:Object.assign({"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Authorization":"Bearer "+tok},(opt&&opt.headers)||{})}))}
  catch(e){throw{st:0,msg:"No hay conexión con GitHub. Revisa tu internet e inténtalo de nuevo."}}
  let j=null;try{j=await res.json()}catch(e){}
  if(!res.ok)throw{st:res.status,msg:(j&&j.message)||("HTTP "+res.status)};
  return j}
const ghErr=e=>e.st===401?"Token inválido o vencido. Genera uno nuevo en GitHub y pégalo aquí.":e.st===403?"GitHub rechazó el acceso: el token no tiene el permiso Contents: Read and write o se alcanzó el límite de peticiones.":e.st===404?"No se encontró el repositorio, la rama o la carpeta, o el token no tiene acceso a este repositorio.":(e.st===409||e.st===422)?"Conflicto al escribir en GitHub ("+e.msg+"). Vuelve a intentarlo.":(e.msg||"Error desconocido");
function ghCfg(){
  const repo=(G.g.repo||"").trim().replace(/^https?:\/\/github\.com\//,"").replace(/\.git$/,"").replace(/\/+$/,"");
  const branch=(G.g.branch||"").trim()||"main",dir=(G.g.dir||"").trim().replace(/^\/+|\/+$/g,"");
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){toast("Escribe el repositorio como usuario/nombre, por ejemplo cepb2706/CRM-Cigarros.",false);return null}
  G.g.repo=repo;return{repo,branch,dir}}
async function ghTest(){
  const c=ghCfg();if(!c)return;
  const nuevo=!!(G.g.token||"").trim(),tok=(G.g.token||"").trim()||GH.token||"";
  if(!tok){toast("Pega tu token de acceso para continuar.",false);return}
  if(!/^(github_pat_|gh[pousr]_)/.test(tok)){toast("Ese texto no parece un token de GitHub: debe empezar por github_pat_ o ghp_.",false);return}
  G.busy="test";render();
  try{
    let r;
    try{r=await ghApi("/repos/"+c.repo,{},tok)}catch(e){throw e.st===404?{msg:"No se encontró el repositorio «"+c.repo+"» o el token no tiene acceso a él."}:e}
    if(r.permissions&&r.permissions.push===false)throw{msg:"El token solo tiene permiso de lectura. Necesita Contents: Read and write."};
    try{await ghApi("/repos/"+c.repo+"/branches/"+encodeURI(c.branch),{},tok)}catch(e){throw e.st===404?{msg:"La rama «"+c.branch+"» no existe en "+c.repo+"."}:e}
    const old=GH;GH={repo:c.repo,branch:c.branch,dir:c.dir,token:tok};
    if(!ghSave()){GH=old;return}
    G.g.token="";
    toast(nuevo?"Token cargado correctamente. Conexión con "+c.repo+" (rama "+c.branch+") verificada.":"Conexión con "+c.repo+" verificada. El token guardado funciona.",true)
  }catch(e){toast("No se pudo cargar el token: "+ghErr(e),false)}
  finally{G.busy="";render()}}
async function ghPub(){
  const c=ghCfg();if(!c)return;
  const tok=(G.g.token||"").trim()||GH.token||"";
  if(!tok){toast("Primero guarda tu token con «Guardar y probar conexión».",false);return}
  G.busy="pub";render();
  const pre=c.dir?c.dir+"/":"",now=new Date().toISOString();
  let done=0;
  try{
    for(const k in ARCH){
      const url="/repos/"+c.repo+"/contents/"+(pre+k).split("/").map(encodeURIComponent).join("/");
      let sha,rem={};
      try{const g=await ghApi(url+"?ref="+encodeURIComponent(c.branch),{},tok);sha=g.sha;try{rem=JSON.parse(ub64(g.content))}catch(e){rem={}}}catch(e){if(e.st!==404)throw e}
      S.tomb=[...new Set([...(S.tomb||[]),...(rem.tomb||[])])];
      ARCH[k].forEach(key=>{S[key]=mrg(rem[key],S[key])});
      limpiarBorrados();
      const body={exportado:now,pub:now,tomb:S.tomb};ARCH[k].forEach(key=>body[key]=S[key]);
      await ghApi(url,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:"Actualizar "+k+" · "+now.slice(0,16).replace("T"," "),content:b64(JSON.stringify(body,null,2)),branch:c.branch,sha})},tok);
      done++}
    S.pub=now;lsSave();
    toast("Publicado: "+done+" archivos en "+c.repo+". GitHub Pages tarda alrededor de un minuto en mostrarlos.",true)
  }catch(e){toast("No se pudo publicar"+(done?" (se subieron "+done+" de 3)":"")+": "+ghErr(e),false)}
  finally{G.busy="";lsSave();render()}}

  X.writeFile(wb,({inv:"inventario",com:"compras",his:"historial",fia:"fiados",teso:"tesoreria"})[k]+"-"+hoy+".xlsx")}
